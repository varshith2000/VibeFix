        test_name: symlinked read and engineer symlinked write rejected; junction exception read-only
        exists: false
    failure_behavior: "Rejection with E_PATH_ESCAPE; audit event; no read/write outside root."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - symlink case matrix
    owner: unassigned
    implementation_work:
      - fs.realpath containment on file routes and engineer write targets
      - make junction read-only to agents
  - id: SEC-010
    category: security
    title: Secret non-exposure (versioned pattern list + canaries)
    statement: >
      Secret shapes defined by a versioned redaction pattern list (bearer/basic
      credentials, x-access-token URLs, KEY=value lines, high-entropy values >20 chars)
      never appear in logs, URLs, argv, reports, or persisted artifacts. Claim scope is
      the pattern list plus planted canaries — not arbitrary future formats.
    status: blocked
    severity: blocker
    enforcement:
      locations:
        - TBD (redact() utility; current logger packages/core/src/util/logger.ts has no redaction)
    tests:
      - test_file: packages/server/test/redaction.test.ts
        test_name: planted canaries absent from logs/events/artifacts/report/argv/.git/config; pattern-list unit tests
        exists: false
    failure_behavior: "Redaction failure fails GATE-11; runtime logs a masked placeholder, never the value."
    configuration:
      required: false
      source: versioned pattern list in repo
    evidence_required:
      - canary scan across a full pipeline run
    owner: unassigned
    implementation_work:
      - shared redact() at logger/error/event boundaries
      - versioned pattern list
  - id: SEC-011
    category: security
    title: Secure git credentials
    statement: >
      GitHub credentials never persist: clone uses per-invocation http.extraheader (or a
      scoped credential helper); remote.origin.url is scrubbed to the bare URL after clone.
    status: blocked
    severity: blocker
    enforcement:
      locations:
        - packages/server/src/app.ts:147 (current URL userinfo — token lands in clone .git/config)
    tests:
      - test_file: packages/server/test/credential.test.ts
        test_name: post-clone remote.origin.url has no userinfo; argv and stderr contain no token
        exists: false
    failure_behavior: "Clone failure returns stderr with userinfo stripped; lingering credential assertion fails loudly."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - credential test after private-repo clone
    owner: unassigned
    implementation_work:
      - switch to extraheader/credential-helper
      - post-clone remote scrub
  - id: SEC-012
    category: security
    title: Execution policy for untrusted repository code (fail-closed landing)
    statement: >
      Repo test/typecheck/lint/build commands do not execute without an approved
      per-project execution policy. When policy prevents baseline or post-change
      execution, proposals do not land: the run completes not-verified with changes
      left on the worktree branch.
    status: blocked
    severity: blocker
    enforcement:
      locations:
