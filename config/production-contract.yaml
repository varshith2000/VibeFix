        exists: false
    failure_behavior: "Missing run 404; corrupt state 500 E_STATE_CORRUPT (target)."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - restart REST test
    owner: unassigned
  - id: REL-007
    category: reliability
    title: Restart does not silently lose run state
    statement: >
