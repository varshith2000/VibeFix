# VibeFix production contract — machine-readable form.
# Generated from docs/production-contract.md (v3.0) and docs/production-acceptance-criteria.md (v2.0).
# Status mapping note: "blocked" = implementation exists but audit-verified to violate the
# requirement (the criteria doc's "failing"); the fix is named in implementation_work.
# All owners are "unassigned" per contract F-01; assignment is release gate GATE-13.
# Test entries with exists: false are required tests not yet written (test requirement only).
version: 1
product:
  name: VibeFix
  deployment_model: local-first-single-user
  status: pre-production

requirements:
  # ---------- security ----------
  - id: SEC-001
    category: security
    title: Default loopback bind
    statement: >
      With no VIBEFIX_HOST set, the server listens on 127.0.0.1:8630 only.
    status: partially-enforced
    severity: blocker
    enforcement:
      locations:
        - packages/server/src/main.ts:8 (HOST default)
        - packages/server/src/main.ts:14 (app.listen)
    tests:
      - test_file: packages/server/test/bind.test.ts
        test_name: binds 127.0.0.1 when VIBEFIX_HOST unset
        exists: false
    failure_behavior: >
      Startup bind failure exits non-zero with E_BIND; currently no defined behavior.
    configuration:
      required: false
      source: env VIBEFIX_HOST / VIBEFIX_PORT
    evidence_required:
      - "bind.test.ts asserts the listen address (to be created)"
    owner: unassigned
  - id: SEC-002
    category: security
    title: Remote binding requires opt-in flag and authentication
    statement: >
      Non-loopback binding exits E_REMOTE_REFUSED at startup unless VIBEFIX_ALLOW_REMOTE=1
      is set and SEC-003/SEC-004 are enforced. A log warning alone is not a control.
    status: planned
    severity: critical
    enforcement:
      locations:
        - TBD (startup gate in packages/server/src/main.ts)
    tests:
      - test_file: packages/server/test/bind.test.ts
        test_name: refuses remote bind without opt-in (never listens)
        exists: false
    failure_behavior: >
      Process exits non-zero before binding; refusal names both required conditions.
    configuration:
      required: true
      source: env VIBEFIX_HOST, VIBEFIX_ALLOW_REMOTE (to be added)
    evidence_required:
      - refusal test proving the socket never opens
    owner: unassigned
    implementation_work:
      - add startup validation gate in main()
      - add VIBEFIX_ALLOW_REMOTE env handling
