        test_name: all routes return 401 E_AUTH without/with invalid token
        exists: false
    failure_behavior: "401 E_AUTH, audit event, no state change."
    configuration:
      required: true
      source: generated token file under ~/.vibefix (to be added)
    evidence_required:
      - auth test enumerating every route
    owner: unassigned
    implementation_work:
      - token generation/persistence at first start
      - onRequest auth hook on all routes except /api/health
      - token delivery to local UI
