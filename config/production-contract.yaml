        test_name: unapproved commands + passing engineer => nothing lands, status not-verified
        exists: false
    failure_behavior: "Unapproved command skipped; gate NOT_APPLICABLE (policy); landing blocked; report discloses not verified."
    configuration:
      required: true
      source: per-project execution policy (to be added)
    evidence_required:
      - exec-policy test
    owner: unassigned
    implementation_work:
      - policy model + approval UX
      - fail-closed gate composition in executeProposal
