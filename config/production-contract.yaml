  # ---------- reliability ----------
  - id: REL-001
    category: reliability
    title: Idempotent, atomic state-changing commands
    statement: >
      start/approve/reject/abort/resume carry idempotency keys; key check and state
      transition execute in one critical section under the run lock (REL-014); outcomes
      persist for replay across restart.
    status: planned
    severity: critical
    enforcement:
      locations:
        - TBD (RunEvent carries no key today, packages/core/src/orchestrator/state.ts:12-29)
    tests:
      - test_file: packages/server/test/idempotency.test.ts
        test_name: sequential replay and N concurrent approvals with one key build exactly one queue
        exists: false
    failure_behavior: "Replay returns the original outcome; duplicates never re-dispatch."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - replay + concurrency test
    owner: unassigned
    implementation_work:
      - add idempotencyKey to command routes and RunEvent
      - seen-key store consulted under the run lock
  - id: REL-002
    category: reliability
    title: Central state-transition validation
    statement: >
      All transitions pass the reducer's phase/status guards; stale or out-of-phase
      events are no-ops with zero effects.
    status: enforced
    severity: major
    enforcement:
      locations:
        - packages/core/src/orchestrator/reducer.ts:25,36,126,138,181-182 (guards)
        - packages/core/src/orchestrator/runtime.ts:116-121 (terminal ignore)
    tests:
      - test_file: packages/core/test/reducer.test.ts
        test_name: "START is idempotent outside init; stale PHASE_COMPLETED is ignored; CHECKPOINT_APPROVED only valid in awaitingApproval; ignores stale gate verdicts"
        exists: true
    failure_behavior: "Stale events produce no effects (tested)."
    configuration:
      required: false
      source: N/A
    evidence_required:
      - reducer.test.ts guard cases green (pnpm test, 2026-09-27)
    owner: unassigned
  - id: REL-003
    category: reliability
    title: Persist before success is reported
    statement: >
      No transition or event is reported or acted on unless durably written; append
      failures retry, set a degraded flag, and never reuse a sequence number.
    status: blocked
    severity: blocker
    enforcement:
      locations:
        - packages/core/src/orchestrator/runtime.ts:115-141 (state path: holds)
        - packages/core/src/store/event-log.ts:57-64 (violates: emits on failed append)
        - packages/core/src/orchestrator/runtime.ts:276 (violates: memory-only agent failure state)
        - packages/core/src/orchestrator/run-manager.ts:144 (violates: non-atomic initial write)
    tests:
      - test_file: packages/core/test/persistence.test.ts
        test_name: read-only run dir mid-run yields an error, never success, and no effects
        exists: false
    failure_behavior: "Persistence failure surfaces as caller error + run degraded flag + persisted failure record."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - failure-injection persistence test
    owner: unassigned
    implementation_work:
      - retry + degraded flag in EventLog.append; persist healed state; atomic initial write
  - id: REL-004
    category: reliability
    title: Monotonic, never-reused event sequence numbers
    statement: >
      Per-run seq is strictly increasing and stable across restart; allocated only on
      durable write; single writer enforced by REL-014; appends are atomic.
    status: partially-enforced
    severity: critical
    enforcement:
      locations:
        - packages/core/src/store/event-log.ts:13,48-54 (counter), 73-84 (line-count recovery)
    tests:
      - test_file: packages/core/test/event-log.test.ts
        test_name: no seq reuse across restart after append failure; no duplicates with two writers
        exists: false
    failure_behavior: "Append failure retries then degrades; no emission with an undurable seq."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - seq-continuity test
    owner: unassigned
    implementation_work:
      - atomic append (reuse atomicWrite from evidence-store.ts:158-181)
      - seq allocation on durable write only
  - id: REL-005
    category: reliability
    title: Exact WebSocket missed-event recovery
    statement: >
      Reconnecting clients receive exactly the missed events: server subscribes before
      the replay read (no gap window) and the client passes since=lastSeq with seq dedup.
    status: partially-enforced
    severity: blocker
    enforcement:
      locations:
        - packages/server/src/app.ts:560-585 (replay honored on connect)
        - packages/ui/src/store.ts:47 (violates target: WS URL omits since)
    tests:
      - test_file: packages/server/test/ws-replay.test.ts
        test_name: reconnect delivers exactly missed events; deterministic connect interleave delivers every event exactly once
        exists: false
    failure_behavior: "Any gap or duplicate in the interleave test fails GATE-08."
    configuration:
      required: false
      source: TBD
    evidence_required:
      - interleave + reconnect tests
    owner: unassigned
    implementation_work:
      - subscribe-before-replay server protocol
      - client passes since and dedups by seq
  - id: REL-006
    category: reliability
    title: REST snapshot recovery
    statement: >
      Any run, live or historical, is fully reconstructable via GET /api/runs/:id and
